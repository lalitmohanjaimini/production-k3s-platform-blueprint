---
# Reference values for the Grafana Community Loki chart.
# Uses HA monolithic mode because Simple Scalable mode is being deprecated.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: REPLACE_ME_UNIQUE_CHUNKS_BUCKET
      ruler: REPLACE_ME_UNIQUE_RULER_BUCKET
      admin: REPLACE_ME_UNIQUE_ADMIN_BUCKET
    s3:
      region: REPLACE_ME
      s3ForcePathStyle: false
      insecure: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h
  compactor:
    retention_enabled: true
    delete_request_store: s3
  rulerConfig:
    enable_api: true

singleBinary:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    storageClass: REPLACE_ME
    size: 20Gi
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: single-binary
          topologyKey: kubernetes.io/hostname

gateway:
  enabled: true
  replicas: 2
  service:
    type: ClusterIP

minio:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
