---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: app-postgres-daily
  namespace: data
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: app-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
