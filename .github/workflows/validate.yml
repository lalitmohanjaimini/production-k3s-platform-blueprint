---
name: Validate blueprint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run repository checks
        run: bash scripts/validate.sh

      - name: Validate Kubernetes resource schemas
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -summary \
            -strict \
            -ignore-missing-schemas \
            /work/manifests/00-namespaces.yaml \
            /work/manifests/metallb/l2-address-pool.yaml \
            /work/manifests/network-policies/default-deny-apps.yaml \
            /work/manifests/postgresql/cluster.yaml
